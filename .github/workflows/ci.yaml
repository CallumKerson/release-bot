name: CI

on:
  pull_request:
    branches: ["main"]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write # to report the test results
    env:
      LINT_JUNITFILE: test-results/lint.xml
      GOTESTSUM_JSONFILE: test-results/tests.json
      GOTESTSUM_FORMAT: github-actions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install tooling
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: mkdir -p test-results && mise run ci
      - name: Report lint results
        id: lint-report
        # A fork's pull request can't create check runs
        if: ${{ !cancelled() && !github.event.pull_request.head.repo.fork }}
        uses: dorny/test-reporter@e432d9eb1656cd7e1b3800a1e9c5d2fb8182f5ee # v3.1.0
        with:
          name: lint results
          path: test-results/lint.xml
          reporter: java-junit
          # Every linter, as there are only a few; the step above already fails the job
          list-suites: all
          list-tests: all
          fail-on-error: false
          # A check run, with annotations on failures, rather than only a job summary
          use-actions-summary: false
      - name: Report test results
        id: test-report
        # A fork's pull request can't create check runs
        if: ${{ !cancelled() && !github.event.pull_request.head.repo.fork }}
        uses: dorny/test-reporter@e432d9eb1656cd7e1b3800a1e9c5d2fb8182f5ee # v3.1.0
        with:
          name: test results
          path: test-results/tests.json
          reporter: golang-json
          # Every suite with its counts, and the tests that failed; the step above already fails the job
          list-suites: all
          list-tests: failed
          fail-on-error: false
          # A check run, with annotations on failures, rather than only a job summary
          use-actions-summary: false
      # dorny writes a check run or a job summary, not both, so the check runs' reports are copied into the summary
      - name: Summarise lint and test results
        if: ${{ !cancelled() && !github.event.pull_request.head.repo.fork }}
        env:
          LINT_REPORT: ${{ steps.lint-report.outputs.summary_file }}
          TEST_REPORT: ${{ steps.test-report.outputs.summary_file }}
        run: |
          for report in "lint results:$LINT_REPORT" "test results:$TEST_REPORT"; do
            if [ -f "${report#*:}" ]; then
              printf '## %s\n\n' "${report%%:*}" >> "$GITHUB_STEP_SUMMARY"
              cat "${report#*:}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::No ${report%%:*} report to summarise"
            fi
          done

  # The GitHub scenarios against the real CallumKerson/release-bot-test-repo, which each scenario resets.
  # They take minutes, so they only run once everything else, including the same scenarios on the fake, has passed.
  e2e:
    name: e2e
    needs: ci
    # Pull requests from forks, and Dependabot's, get no secrets
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The lock on the test repository: one job at a time across every run, the rest queued in order.
    # GitHub releases it however the job ends, so it can't go stale. A new push still cancels the job,
    # queued or running, through the workflow's concurrency group; every scenario resets the repository first.
    concurrency:
      group: release-bot-test-repo
      queue: max
    # The GitHub App's credentials, without recording a deployment in every pull request's timeline
    environment:
      name: e2e
      deployment: false
    permissions:
      contents: read
      actions: read
      checks: write # to report the test results
    steps:
      - name: Get a token for the GitHub App
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.E2E_APP_CLIENT_ID }}
          private-key: ${{ secrets.E2E_APP_PRIVATE_KEY }}
          owner: CallumKerson
          repositories: release-bot-test-repo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: go gotestsum
      - run: gotestsum --format github-actions --jsonfile test-results/e2e.json -- -tags e2e ./features -run TestEndToEnd -count=1
        env:
          RELEASE_BOT_E2E_REPOSITORY: CallumKerson/release-bot-test-repo
          RELEASE_BOT_E2E_TOKEN: ${{ steps.app.outputs.token }}
      - name: Report end-to-end results
        id: e2e-report
        # A fork's pull request can't create check runs
        if: ${{ !cancelled() && !github.event.pull_request.head.repo.fork }}
        uses: dorny/test-reporter@e432d9eb1656cd7e1b3800a1e9c5d2fb8182f5ee # v3.1.0
        with:
          name: e2e results
          path: test-results/e2e.json
          reporter: golang-json
          # Every suite with its counts, and the tests that failed; the step above already fails the job
          list-suites: all
          list-tests: failed
          fail-on-error: false
          # A check run, with annotations on failures, rather than only a job summary
          use-actions-summary: false
      - name: Summarise end-to-end results
        if: ${{ !cancelled() }}
        env:
          REPORT: ${{ steps.e2e-report.outputs.summary_file }}
        run: |
          if [ -f "$REPORT" ]; then
            printf '## e2e results\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No e2e results report to summarise"
          fi
