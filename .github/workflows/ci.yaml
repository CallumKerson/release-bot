name: CI

on:
  pull_request:
    branches: ["main"]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install tooling
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: mise run ci

  # The GitHub scenarios against the real CallumKerson/release-bot-test-repo, which each scenario resets.
  # They take minutes, so they only run once everything else, including the same scenarios on the fake, has passed.
  e2e:
    name: e2e
    needs: ci
    # Pull requests from forks, and Dependabot's, get no secrets
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The lock on the test repository: one job at a time across every run, the rest queued in order.
    # GitHub releases it however the job ends, so it can't go stale. A new push still cancels the job,
    # queued or running, through the workflow's concurrency group; every scenario resets the repository first.
    concurrency:
      group: release-bot-test-repo
      queue: max
    # The GitHub App's credentials, without recording a deployment in every pull request's timeline
    environment:
      name: e2e
      deployment: false
    steps:
      - name: Get a token for the GitHub App
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.E2E_APP_CLIENT_ID }}
          private-key: ${{ secrets.E2E_APP_PRIVATE_KEY }}
          owner: CallumKerson
          repositories: release-bot-test-repo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: go
      - run: go test ./features -run TestEndToEnd -count=1 -v -godog.format=pretty
        env:
          RELEASE_BOT_E2E_REPOSITORY: CallumKerson/release-bot-test-repo
          RELEASE_BOT_E2E_TOKEN: ${{ steps.app.outputs.token }}
